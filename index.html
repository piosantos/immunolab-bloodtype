<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/pwa-192x192.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <meta name="description" content="Offline-first hematology simulation." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/pwa-192x192.svg" />
  <title>ImmunoLab Pro</title>
</head>

<body class="bg-slate-950 text-white">
  <div id="rotate-warning"
    style="display: none; position: fixed; inset: 0; z-index: 9999; background-color: #020617; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" style="margin-bottom: 1rem; animation: spin 3s linear infinite;">
      <path d="M21 12a9 9 0 1 1-6.219-8.56" />
    </svg>
    <h2 style="font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem;">Rotate Device</h2>
    <p style="color: #94a3b8;">ImmunoLab requires landscape mode.</p>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <style>
    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @media screen and (orientation: portrait) and (max-width: 1024px) {
      #root {
        display: none !important;
      }

      #rotate-warning {
        display: flex !important;
      }
    }
  </style>
</body>

</html>
